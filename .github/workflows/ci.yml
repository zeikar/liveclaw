name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npx electron-vite build

      # The e2e suites launch the real app against the build above, so they run here rather than
      # through `npm run test:e2e`, which would build it a second time. The runner has no display —
      # xvfb-run supplies one, and Electron falls back to software GL inside it.
      - run: xvfb-run --auto-servernum npx playwright test
